<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>dsh-ui-zoom regression harness</title>
<style>
  html, body { margin: 0; height: 100%; }
  #editable {
    position: absolute;
    left: 40px;
    top: 60px;
    width: 460px;
    font: 16px/1.5 monospace;
    white-space: pre;
    outline: none;
  }
  #probe {
    position: absolute;
    left: 0;
    top: 0;
    visibility: hidden;
    white-space: pre;
    font: 16px monospace;
  }
  /* Third-party modal dialog pattern: capped with viewport units, header with a
     close button. Under CSS zoom the cap is zoom-factor too large, which is the
     bug the dialog shim fixes. */
  #tall-dialog {
    margin: auto;
    padding: 0;
    width: min(640px, 94vw);
    max-width: calc(100vw - 32px);
    max-height: calc(100vh - 40px);
    overflow: hidden;
    border: 1px solid #cccccc;
    border-radius: 12px;
  }
  #tall-dialog[open] { display: flex; flex-direction: column; }
  #tall-dialog header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 16px 24px;
    border-bottom: 1px solid #dddddd;
    flex: none;
  }
  #tall-body { overflow: auto; min-height: 0; padding: 20px 24px; }
  #tall-close { min-width: 32px; min-height: 30px; }
  /* Fixed overlay capped with viewport units — the route-panel/alert pattern.
     Under CSS zoom the cap is zoom× the window, so it runs past the bottom. */
  #vh-overlay {
    position: fixed;
    top: 48px;
    right: 28px;
    width: min(360px, 90vw);
    max-height: calc(100vh - 72px);
    overflow: auto;
    display: none;
    background: #ffffff;
    border: 1px solid #cccccc;
  }
  #vh-overlay.on { display: block; }
</style>
<script>
  // Minimal host shims: the real client.js runs unchanged against a fake module
  // loader, a fake React, and optional locale/shortcuts service doubles.
  window.__errors = [];
  window.addEventListener('error', event => window.__errors.push(String(event.message)));
  window.addEventListener('unhandledrejection', event => window.__errors.push(String(event.reason)));
  // Native geometry, captured before the plugin patches the prototypes, so the
  // harness can see the pixels the browser really paints and hit-tests.
  window.__native = {
    rect: Element.prototype.getBoundingClientRect,
    innerHeight: Object.getOwnPropertyDescriptor(window, 'innerHeight').get,
    innerWidth: Object.getOwnPropertyDescriptor(window, 'innerWidth').get,
    elementFromPoint: Document.prototype.elementFromPoint,
  };
  const params = new URLSearchParams(location.search);
  const scale = params.get('scale') || '125';
  if (params.get('config')) {
    try { window.__DSH_UI_ZOOM_CONFIG__ = JSON.parse(params.get('config')); } catch (error) { window.__errors.push('config: ' + error.message); }
  }
  if (params.get('nosave') === '1') {
    try { localStorage.removeItem('dsh.ui.zoom_scale'); } catch (error) {}
  } else {
    try { localStorage.setItem('dsh.ui.zoom_scale', scale); } catch (error) {}
  }

  const fakeReact = {
    createElement: (...args) => ({ args }),
    useState: value => [typeof value === 'function' ? value() : value, () => {}],
    useEffect: () => {},
  };

  const localeEnabled = params.get('locale') === '1';
  let localeTest = null;
  if (localeEnabled) {
    const state = { active: params.get('lang') || 'zh', dicts: new Map(), listeners: new Set(), revision: 0 };
    const service = {
      getSnapshot() { return { active: state.active, revision: state.revision, locales: [] }; },
      subscribe(listener) { state.listeners.add(listener); return () => { state.listeners.delete(listener); }; },
      register(namespace, dictionaries) {
        state.dicts.set(namespace, dictionaries);
        state.revision += 1;
        for (const listener of [...state.listeners]) listener();
        return () => { state.dicts.delete(namespace); };
      },
      bind(namespace) {
        return (key, values) => {
          const languages = state.dicts.get(namespace) || {};
          const active = languages[state.active] || languages.en || {};
          let text = active[key];
          if (text === undefined) text = (languages.en || {})[key];
          if (text === undefined) return key;
          if (values) for (const [name, value] of Object.entries(values)) text = text.split('{' + name + '}').join(String(value));
          return text;
        };
      },
    };
    localeTest = {
      service,
      state,
      setActive(language) {
        state.active = language;
        state.revision += 1;
        for (const listener of [...state.listeners]) listener();
      },
      registrations: () => state.dicts.size,
    };
    window.__localeTest = localeTest;
  }

  const shortcutsMode = params.get('shortcuts');
  let shortcutService = null;
  if (shortcutsMode) {
    const registrations = [];
    let disposed = 0;
    let sequence = 0;
    shortcutService = {
      register(command) {
        sequence += 1;
        if (shortcutsMode === 'throws' || (shortcutsMode === 'throws-second' && sequence === 2)) {
          throw new Error('conflicting binding');
        }
        registrations.push(command);
        return () => { disposed += 1; };
      },
    };
    window.__shortcutsTest = {
      registrations,
      disposed: () => disposed,
      run(id) {
        const command = registrations.find(item => item.id === id);
        if (!command) throw new Error('missing command ' + id);
        const resolved = command.resolve({ region: 'page', modal: null, target: null });
        if (resolved.status === 'handled') resolved.run();
        return resolved.status;
      },
    };
  }

  window.__ModuleLoader__ = {
    load({ factory }) {
      window.__plugin = factory(name => {
        if (name === 'react') return fakeReact;
        throw new Error('unexpected require: ' + name);
      });
      window.__pluginApplied = false;
      const cleanups = [];
      const ctx = {
        effect(callback) {
          const cleanup = callback();
          if (typeof cleanup === 'function') cleanups.push(cleanup);
        },
        slots: { inject() {}, register() { return () => {}; } },
        get(name) {
          if (name === 'locale') return localeTest === null ? undefined : localeTest.service;
          if (name === 'shortcuts') return shortcutService;
          return undefined;
        },
        locale: localeTest === null ? undefined : localeTest.service,
      };
      try {
        window.__plugin.apply(ctx);
        window.__pluginApplied = true;
        window.__pluginCleanups = cleanups;
      } catch (error) {
        window.__errors.push('apply: ' + String((error && error.stack) || error));
      }
    },
  };
</script>
<script src="/plugin/client.js"></script>
</head>
<body>
<div id="editable" contenteditable="true"></div>
<div id="probe"></div>
<dialog id="tall-dialog" aria-label="tall dialog">
  <header>
    <strong>tall dialog</strong>
    <button id="tall-close" type="button" aria-label="close">×</button>
  </header>
  <div id="tall-body"></div>
</dialog>
<div id="vh-overlay"><div id="vh-overlay-body"></div></div>
<script>
  const TEXT = 'abcdefghij'.repeat(20);
  const editable = document.getElementById('editable');
  editable.textContent = TEXT;
  window.__text = TEXT;
  window.__measureChar = () => {
    const probe = document.getElementById('probe');
    probe.textContent = 'a';
    const width = probe.getBoundingClientRect().width;
    probe.textContent = '';
    return width;
  };
  window.__hit = null;
  editable.addEventListener('mousedown', event => {
    const rect = editable.getBoundingClientRect();
    const range = document.caretRangeFromPoint(event.clientX, event.clientY);
    window.__hit = {
      clientX: event.clientX,
      clientY: event.clientY,
      rectLeft: rect.left,
      rectTop: rect.top,
      caretOffset: range === null ? null : range.startOffset,
      charWidth: window.__measureChar(),
      zoom: getComputedStyle(document.documentElement).zoom,
    };
  }, true);
  window.__pageReady = true;

  // --- Modal dialog fixture (viewport-unit overflow under CSS zoom) ----------
  const tallDialog = document.getElementById('tall-dialog');
  const tallBody = document.getElementById('tall-body');
  for (let index = 0; index < 160; index += 1) {
    const paragraph = document.createElement('p');
    paragraph.textContent = 'line ' + index + ' — 费用明细 / cost detail sample text';
    tallBody.appendChild(paragraph);
  }
  window.__openTallDialog = () => { tallDialog.showModal(); };
  window.__closeTallDialog = () => { if (tallDialog.open) tallDialog.close(); };
  // --- Fixed overlay fixture (viewport-unit cap under CSS zoom) --------------
  const vhOverlay = document.getElementById('vh-overlay');
  const vhOverlayBody = document.getElementById('vh-overlay-body');
  for (let index = 0; index < 120; index += 1) {
    const paragraph = document.createElement('p');
    paragraph.textContent = 'route ' + index + ' — 远程路由 / route detail sample text';
    vhOverlayBody.appendChild(paragraph);
  }
  window.__openVhOverlay = () => {
    vhOverlay.classList.add('on');
  };
  window.__vhOverlayState = () => {
    const native = window.__native;
    const rect = native.rect.call(vhOverlay);
    const viewport = { width: native.innerWidth.call(window), height: native.innerHeight.call(window) };
    return {
      open: vhOverlay.classList.contains('on'),
      clamped: vhOverlay.hasAttribute('data-dsh-ui-zoom-clamp'),
      rect: { top: rect.top, bottom: rect.bottom, left: rect.left, right: rect.right, height: rect.height },
      viewport,
      fits: rect.top >= -0.5 && rect.left >= -0.5 && rect.bottom <= viewport.height + 0.5 && rect.right <= viewport.width + 0.5,
    };
  };
  // What the browser is about to paint for the very first frame of the dialog:
  // requestAnimationFrame callbacks run before style/layout/paint of that frame,
  // so a clamp applied here in time means the dialog never flashes at its
  // overflowing size and then jumps into place.
  window.__openTallDialogFirstFrame = () => new Promise(resolve => {
    tallDialog.showModal();
    requestAnimationFrame(() => {
      const native = window.__native;
      const rect = native.rect.call(tallDialog);
      const viewportHeight = native.innerHeight.call(window);
      resolve({
        clamped: tallDialog.hasAttribute('data-dsh-ui-zoom-clamp'),
        height: rect.height,
        fits: rect.top >= -0.5 && rect.bottom <= viewportHeight + 0.5,
      });
    });
  });
  window.__dialogState = () => {
    const native = window.__native;
    const rect = native.rect.call(tallDialog);
    const buttonRect = native.rect.call(document.getElementById('tall-close'));
    const viewport = { width: native.innerWidth.call(window), height: native.innerHeight.call(window) };
    const center = { x: (buttonRect.left + buttonRect.right) / 2, y: (buttonRect.top + buttonRect.bottom) / 2 };
    const hit = native.elementFromPoint.call(document, center.x, center.y);
    return {
      open: tallDialog.open,
      modal: (() => { try { return tallDialog.matches(':modal'); } catch (error) { return null; } })(),
      clamped: tallDialog.hasAttribute('data-dsh-ui-zoom-clamp'),
      rect: { top: rect.top, bottom: rect.bottom, left: rect.left, right: rect.right, width: rect.width, height: rect.height },
      viewport,
      fits: rect.top >= -0.5 && rect.left >= -0.5 && rect.bottom <= viewport.height + 0.5 && rect.right <= viewport.width + 0.5,
      buttonCenter: center,
      buttonHit: hit === null ? null : (hit.id || hit.tagName),
      buttonVisible: buttonRect.top >= 0 && buttonRect.bottom <= viewport.height,
    };
  };
</script>
</body>
</html>
