name: regression

on:
  push:
    branches: [main]
  pull_request:

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: chrome
        uses: browser-actions/setup-chrome@v1
      - name: Run regression harness
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm test
